name: Canary
# Seeds unique bait into prompts sent to every keyed host. Only the hashes of the bait
# are committed, and their Merkle root is anchored on Solana before anything is sent.
# The listener (listener/) records any later request that carries a bait token.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      per_endpoint:
        description: Bait prompts per endpoint
        default: "3"
permissions:
  contents: write
  id-token: write
concurrency:
  group: canary
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the listener is configured
        id: cfg
        run: |
          if [ -n "$(node -e 'console.log(require("./canary.json").listener)')" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No listener URL in canary.json yet; skipping."
          fi
      - name: Seed bait
        if: steps.cfg.outputs.ready == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node src/seed.ts --selftest --per-endpoint "${{ inputs.per_endpoint || '3' }}"
      - name: Commit seed commitments
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git config user.name "verity-canary"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/canary
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -m "Canary seeds $(date -u +%F)"
            git pull --rebase && git push
          fi
