name: Audit
# Runs the probes against every endpoint that has a key in the repository
# secrets, commits the results and raw evidence, then publishes the board.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Load private probes, if any
        env:
          VERITY_PROBES_JSON: ${{ secrets.VERITY_PROBES_JSON }}
        run: |
          if [ -n "$VERITY_PROBES_JSON" ]; then
            printf '%s' "$VERITY_PROBES_JSON" > "$RUNNER_TEMP/probes.json"
            echo "VERITY_PROBES_FILE=$RUNNER_TEMP/probes.json" >> "$GITHUB_ENV"
          fi
      - name: Run audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node src/cli.ts --skip-if-no-keys
      - name: Anchor the evidence on Solana
        if: hashFiles('results/latest.json') != ''
        continue-on-error: true
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          SOLANA_SECRET_KEY: ${{ secrets.SOLANA_SECRET_KEY }}
        run: node src/anchor.ts
      - name: Commit results
        run: |
          git config user.name "verity-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Audit results $(date -u +%F)"
            git pull --rebase && git push
          fi
  board:
    needs: audit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/board.yml
