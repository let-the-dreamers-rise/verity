name: Recall
# Training-canary recall test. Monthly, and on demand when a new model is released.
on:
  schedule:
    - cron: "11 9 1 * *"
  workflow_dispatch:
    inputs:
      facts: { description: Facts to test per model, default: "30" }
      only: { description: Comma-separated endpoint ids (blank for all), default: "" }
permissions:
  contents: write
  id-token: write
jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node src/recall.ts --facts "${{ inputs.facts || '30' }}" --only "${{ inputs.only }}"
      - run: |
          git config user.name verity-recall
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/recall
          git diff --cached --quiet || { git commit -m "Recall test $(date -u +%F)"; git pull --rebase && git push; }
